[project]
name = "pegel-latte"
version = "0.1.0"
description = "Read water levels from Pegellatte (water gauge) photos using computer vision and OCR"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "easyocr>=1.7.2",
    "exifread>=3.5.1",
    "opencv-python-headless>=4.13.0.92",
    "pillow>=12.2.0",
]

[project.scripts]
pegel-latte = "pegel_latte.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pegel_latte"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
